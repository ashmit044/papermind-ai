[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "papermind-ai"
version = "0.1.0"
description = "AI-powered academic research paper digest, local RAG Q&A, and knowledge graph synthesizer."
readme = "README.md"
authors = [
    { name = "Ashmit", email = "ashmit@example.com" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["ai", "nlp", "rag", "embeddings", "research", "paper-summarizer", "knowledge-graph", "streamlit", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup :: Markdown"
]

dependencies = [
    "pymupdf>=1.23.0",
    "sentence-transformers>=2.6.0",
    "faiss-cpu>=1.7.4",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.32.0",
    "plotly>=5.19.0",
    "networkx>=3.2.1",
    "loguru>=0.7.2",
    "pydantic>=2.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.2.0",
    "ruff>=0.2.2",
    "mypy>=1.8.0"
]

[project.scripts]
papermind = "papermind.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
